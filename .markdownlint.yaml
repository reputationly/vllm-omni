# Keep these rules aligned with vLLM so MkDocs Material syntax is tolerated.
MD007:
  indent: 4
MD013: false
# GitHub READMEs start with a centered logo, not an H1.
MD041: false
MD024:
  siblings_only: true
MD025:
  # Allow front matter title to be different from the first heading in the document.
  front_matter_title: ""
MD031:
  list_items: false
MD033: false
MD046: false
MD052: false
MD059: false
# Deliberate divergence from the list above: MD060 (table column style) was introduced
# in markdownlint v0.41, which this repo's pinned pre-commit hook now resolves to, while
# the vLLM-aligned list above predates it. It is purely cosmetic -- it asks that table
# pipes line up with the header row -- and the tree has 411 of them across 100+ files,
# most of them upstream's. Reformatting those tables would add conflict surface to every
# future sync for no readability gain, so the rule is off here rather than applied.
# Revisit if upstream enables it, or when the hook's rev moves again.
MD060: false
