# MiniMax-H3 DiT deploy (joint video + audio).
#
# H3 is a pure diffusers repo — no root config.json, only model_index.json
# naming MiniMaxH3Pipeline — so `minimax_h3_dit` is a DEPLOY-ONLY pipeline key:
# nothing in try_infer_model_type can auto-select it, and naming it here is the
# only way in. Launching `vllm serve <h3-path> --omni` without --deploy-config
# behaves exactly as it did before this file existed.
#
# One diffusion stage across 4 GPUs. world_size is derived from parallel_config
# (tp * sp * cfg * pp * dp), so --num-gpus is not needed on this path.
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    max_num_seqs: 1
    devices: "0,1,2,3"
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 1
      vae_parallel_mode: tile
      text_encoder_tp_size: 1
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
