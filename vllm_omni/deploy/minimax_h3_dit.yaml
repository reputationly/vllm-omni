# MiniMax-H3 DiT deploy (joint video + audio).
#
# H3 is a pure diffusers repo — no root config.json, only model_index.json
# naming MiniMaxH3Pipeline — so `minimax_h3_dit` is a DEPLOY-ONLY pipeline key:
# nothing in try_infer_model_type can auto-select it, and naming it here is the
# only way in. Launching `vllm serve <h3-path> --omni` without --deploy-config
# behaves exactly as it did before this file existed.
#
# One diffusion stage across 4 GPUs. world_size is derived from parallel_config
# (tp * sp * cfg * pp * dp), so --num-gpus is not needed on this path.
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    max_num_seqs: 1
    # Which contract this instance serves. Omitted means `legacy`, i.e. exactly
    # what production runs today. `official_diffusers_v1` switches the model
    # semantics — RNG stream, reference geometry and order, default frame count,
    # media normalization — to the pinned Diffusers MiniMaxH3ModularPipeline.
    #
    # It changes the output of every seed, including t2va, so it belongs to an
    # instance, never to a request. A value that cannot be applied fails at
    # startup rather than falling back.
    #
    # minimax_h3_inference_contract: official_diffusers_v1
    #
    # What the deployment accepts (upload size, container/codec whitelists,
    # resource budgets). Orthogonal to the contract above: production may refuse
    # media the official in-memory interface would take, but refusing it must
    # never change the semantics of media already accepted.
    #
    # minimax_h3_admission_policy: production_safe_v1
    devices: "0,1,2,3"
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 1
      vae_parallel_mode: tile
      text_encoder_tp_size: 1
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
