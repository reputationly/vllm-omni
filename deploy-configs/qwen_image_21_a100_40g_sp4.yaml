# Qwen-Image-2.1 — A100 PCIE 40G x4
#
# **一种部署形态，多实例横向扩**。t2i 与 i2i 是同一套权重、同一个部署，
# 任务由请求带不带图决定；不要为编辑单独起服务。
#
# 定档：W8A16 + fp8 前缀 KV + Ulysses SP4 + VAE tiling + expandable_segments
#
# 为什么是 W8A16 而不是 int8(W8A8)
#   W8A8 会稳定把正文写错（"今天上午" → "今天上上午"，seed 42/43/44 复现，BF16 同 seed
#   全对）。因果链是逐层排掉的：BF16 正确 → W8A8 必错 → 排除 img_mlp 无改善 →
#   W8A16 干净，所以**根因是逐 token 的激活量化，不是权重**。W8A16 只量化权重、
#   激活保持 bf16，构图与文字都不劣化。
#   （int8 档的 ACTIVATION_SCHEMES 只有 "dynamic"，给不出 weight-only，所以走 TorchAO。
#    镜像里必须有 torchao —— 见 docker/Dockerfile.cuda，它要装在 `uv pip install .` 之后。）
#
# 为什么权重不用 fp8（与下面前缀 KV 的 fp8 存储是两回事）
#   A100 是 sm80，cutlass c2x 没有 fp8 路径，**启动直接崩**（已报 vllm#55008；
#   根因是 CutlassFP8ScaledMMLinearKernel.can_implement() 无条件返回 True）。
#
# 为什么是 SP 不是 TP
#   TP 在第 4 张卡上撞 PCIe 通信墙（TP4 1938ms/步，比 TP2 的 1868ms 还慢）。
#   SP 切序列维、通信随卡数摊薄，是这台机器上唯一能扩的轴（SP4 1159ms，2.59×）。
#   TP2 另有硬伤：text encoder 不可分片会 OOM。
#
# extras.prefix_kv_cache_dtype = fp8（K 与 V 都存 e4m3；2026-09-23 由 fp8_v 改来）
#   2.1 把文本 + 条件图的前缀 K/V 在第一步算完缓存、后 39 步复用，**SP 下每张卡各存
#   一份完整副本**。每张 1024² 条件图 = 4096 token，每卡缓存：原生 2.00 / fp8_v 1.52 /
#   fp8 1.03 GiB。t2i 的前缀只有提示词，三档显存与时延都无差；只有多参考图才吃这份账。
#   画质：20 组 PE 用例逐张目视，fp8_v 与 fp8 都没有可见的系统性变差（PSNR 低主要是
#   构图平移，官方 use_kv_cache 文档里同一现象）。旧注释里 recipe 的 "fp8 只有 34.9 dB"
#   在这个 workload 上不成立。
#   为什么从 fp8_v 换成 fp8：10 张参考图时 fp8_v 高水位 39.45 GiB（卡 39.49），余量
#   只有几十 MiB；fp8 是 35.86 GiB，余 3.6 GiB。代价：10 张 36.4s vs 33.2s，t2i 无差。
#
# env PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True —— **必须设**
#   不设时碎片让 fp8_v 的 10 张请求 6 次全 OOM；设了之后同样的请求序列全过。
#   GPUStack 实例默认没有这个变量，要在模型的环境变量里显式加。
#
# 请求侧上限（OOM 只让该条请求返回 500，实例随后 /ready=200，不会砖）
#   · i2i 参考图 ≤ 10（fp8 下冷启直打、2K 文生图后直跳、10 张 + 2752x1536 输出、
#     5900 字提示词、3 并发、交错循环全部通过）
#   · CFG（true_cfg_scale>1 + negative_prompt）两支（cond/uncond）各缓存一份含全部参考图
#     的前缀；n=2 是 batch 2、每行各缓存一份 —— 缓存都翻倍。fp8 能缓解（CFG 下 fp8_v 4 张、
#     fp8 6~8 张），但 10 张两档都装不下：fp8 下 CFG ≤ 6 张、n=2 ≤ 4 张；n>2 的 i2i 未测。
#     官方默认不开 CFG；n=2 与连发两条 n=1 一样慢（A100 算力已满，batch 不增吞吐），
#     网关应把 n 拆成多条 n=1 分给不同副本
#   · t2i 带 CFG / n≤4 @2K 都安全（高水位 18.9 / 20.8 / 24.8 GiB）
#
# 条件图（参考图）尺寸：自适应（2026-09-23 起，代码默认行为，无需配置）
#   请求不带 condition_resolution 时，每张参考图面积 = min(输出面积, 原图面积)，不低于 1024²；
#   总和超预算则平均分（小图保留自己的份额）。CFG 预算减半、n>1 除以 n。
#   1024 输出或小参考图与旧的固定 1024² 逐字节一致；2K 输出 + 大参考图才放大 ——
#   编辑 2K 海报时小字从乱码变为逐字正确，代价是图生图 +24%（1 张）~ +51%（多张）。
#   预算环境变量 VLLM_OMNI_QWEN_IMAGE_21_CONDITION_BUDGET_MPX，默认 11：输出 2752x1536 时
#   ≤11.4 MP 各组合每卡余量 ≥3.5 GiB，12.6 MP 余 ~2 GiB，~13.3 MP 为悬崖（峰值在 DiT 预填充）。
#
# 实测（2026-09-22，合并 upstream 后的干净镜像，gpu48）
#   BF16 档 2048² 冷启 47s（此前热态基线 37s）。W8A16+fp8_v 档见本轮验收记录。
#
# 两个请求侧的坑（都不是本文件能修的，网关要注意）
#   · /v1/images/generations 会吞掉本文件里的 default_sampling_params，
#     只有 get_default_sampling_params_list 那条路生效。
#   · 步数不能省，这个模型只有 40 步档。
#
# 启动：
#   vllm serve /nfs-models/wuhanjisuan894/models/Qwen-Image-2.1 --omni \
#     --deploy-config deploy-configs/qwen_image_21_a100_40g_sp4.yaml \
#     --host 0.0.0.0 --port 8091 --stage-init-timeout 900
pipeline: qwen_image_21
trust_remote_code: true
stages:
  - stage_id: 0
    max_num_seqs: 1
    devices: "0,1,2,3"
    vae_use_tiling: true
    quantization_config:
      method: torchao_int8_weight_only
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 1
      sequence_parallel_size: 1
      ulysses_degree: 4
      ring_degree: 1
      cfg_parallel_size: 1
    extras:
      prefix_kv_cache_dtype: "fp8"
