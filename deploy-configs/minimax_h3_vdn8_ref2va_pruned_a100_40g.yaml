# VDN-MiniMax-H3 REF2VA 8 步（混合注意力 + 曲线剪枝 r8 + INT8 W8A16）— DiT stage, A100 PCIE 40G x4
#
# 这是替换现网 ref2va（Turbo8 + 剪枝r8 + INT8）的那一档。
#
# --- 权重 ---
#   /nfs-data/models/MiniMax-H3-Ref2VA-Pruned-VDNfull-INT8-vLLM        19.5 GB
#   --lora-path /nfs-data/models/VDN-MiniMax-H3/stage-dmd-step-250-curve-ref2va-baked
#
#   两个都必须是 -curve-ref2va 那一套，不能拿 t2va/fl2va 的：AdaLN 的曲线拟合是**按
#   分区**做的（每个分区有自己的 time_embedder），拿错分区的投影结果加载不会报错，
#   只会把 turbo 采样到错误的调制上。
#
#   注意这一条**只对本文件这份自研制品成立**。社区微调 Singularity 的 ref2va 走
#   minimax_h3_singularity_vdn8_ref2va_a100_40g.yaml，那边反过来必须用 curve-fl2va
#   （它血统是 FL2VA，曲线表与 FL2VA 分区逐位相同）。判据是曲线表逐位比对，不是
#   文件名 —— Singularity 的文件名也写着 ref2va。两份 YAML 正文逐字段相同，区别
#   全在配套的权重与 lora，别互相照抄注释。
#
# --- 为什么能同时剪枝和上 VDN ---
#   剪枝把 51 个 AdaLN 投影的输入从 2688 维时间嵌入换成 8 维采样表，而 VDN 的 turbo
#   适配器带的是 [out, 2688] 的 delta，形状对不上。turbo 是 DMD 阶段以冻结的 Stage-B
#   VDN 为 real score 蒸出来的，和线性分支是一对，换成别的少步适配器就是拆对。
#
#   解法是把 delta 也换算到那 8 维坐标里。可行的原因是 AdaLN 的输入不是任意向量：
#   它是 silu(time_embedder(t))，一次生成里只取 1025 个离散值，所以只要在这 1025 个
#   点上拟合，而且必须是**仿射**（带截距）——纯线性拟合的相对残差是 0.9978，加上一列
#   常数变成 1.4e-05。工具见 tools/minimax_h3/project_vdn_turbo_to_pruned_curve.py。
#
#   体积因此从未剪枝的 43.8 GB 降到 19.5 GB，而剪枝版与未剪枝版同 seed 出片一致
#   （锐度 59.4/59.2、127.3/131.0）。省显存的是剪枝，投影只是让两者能共存。
#
# --- 硬约束（配错不会报错，只会渲染出「看着正常但不是这个模型」的片子）---
#   1. diffusion_attention_backend 必须是 VDN_WINDOW_ATTN。线性分支是窗口的补集，
#      配稠密 attention 会把窗口外的帧算两遍。启动时 validate_hybrid_runtime 拦。
#   2. ulysses_degree / ring_degree 必须是 1。分支的扫描沿帧展开，需要每张卡都有
#      完整的目标视频行。用 TP 切头。
#   3. ref2va 跑的是另一份 DiT（transformer_ref/），VDN 的适配器**没有在它上面训练
#      过**。实测它是 transformer/ 的轻微微调（cosine 0.99953、相对 L2 3.1%），迁移
#      看起来成立，但**未经验证**，必须显式开 VLLM_OMNI_VDN_ALLOW_UNTRAINED_TASKS=1
#      （每次请求都会告警）。
#   4. flow_shift 不在这里设：制品的 metadata.json 声明 12.0（音频 3.0），管线启动时
#      会用它覆盖 ref2va 分区声明的 6.0 并打日志。**别照抄 t2va 的请求参数去测**——
#      现网 ref2va 静默忽略请求里的 flow_shift，VDN 不会，于是同一条请求两边跑的是
#      不同的档。
#
# --- 显存 ---
#   官方多镜头长 prompt 会顶穿 40G：VDN 的窗口对全局行（文本/音频/参考图）双向稠密，
#   所以显存随 prompt 长度涨，单句 prompt 测不出来。下面两个环境变量是必需的，不是调优：
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#     VLLM_OMNI_VDN_KV_GATHER_BUDGET_MB=192          （默认 512）
#   日志里出现「reserved but unallocated 3.5 GiB」就是该开 expandable_segments 的信号。
#   注意跑完再采 nvidia-smi 得到的是 DiT offload 之后的数，不是峰值，别拿它判余量。
#
#   ref2va 还要第三个（fl2va 不需要，见文末）：
#     VLLM_OMNI_H3_REF_IMAGE_MAX_PIXELS=1032192
#
#   参考图是这套代码里**唯一没有面积封顶**的一条路：参考视频按 768x1344 封顶、输出
#   画布按 768x1344 封顶，只有参考图不封，短边被归一到 2048。所以**一张**参考图占
#   7168~10240 行（随宽高比变），不是 1008 行；9 张就是 64512~92160 行。
#
#   不设这个变量时，9 图的真实行为不是「能用」而是「第一条能用」：
#     全新进程第 1 条  200  1355 s
#     紧接着第 2 条    OOM     9 s
#   空闲的实例过、忙过的实例崩——验收测一发发现不了，上线忙起来才炸。
#
#   设为 1032192（= 768*1344，与视频/输出对齐）后单图恒 <=1008 rows：
#     9 图          492 s（无封顶 1355 s，快 2.8 倍）
#     9 图 + 3 视频  通过（契约上限，之前必崩）
#     现网 0039 连发两条 9 图  481 s / 399 s  两条都过
#   缩放是等比的（area_scale = sqrt(max_pixels/area)，宽高同乘），32 对齐带来的偏差
#   不超过一个 patch。画质 A/B（同 prompt/seed/参考图）：锐度 63.3->60.4、运动
#   30.97->32.69，人眼看不出差异，产物在 /nfs-output/vdn-h3/参考图面积封顶-20260909/。
#
#   **只加在 ref2va 上。** fl2va 只有 1~2 张关键帧，峰值 32.6 GiB、余量 6.9 GiB，
#   首尾帧也已跑通（307 s），不需要降参考图分辨率。该变量按实例生效，两边互不影响。
#
# --- 实测（15 秒档，4 条官方多镜头 prompt）---
#   370~462 s，零 OOM；发 flow_shift=6 会被拒（400），证明档位跟的是制品不是分区。
#
# --- 许可 ---
#   MiniMax H3 Community License，带地域限制（排除 EU/UK/KR/US），商用前过法务。
#
# --- 挪不进本文件的东西 ---
#   VLLM_OMNI_* 环境变量、--init-timeout / --stage-init-timeout、--lora-path，
#   原因见 minimax_h3_a100_40g.yaml 的注释，此处不重复。
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: ref2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    # 短边 1080 生成档,**追加式**(768 仍然合法)。
    #
    # --- 与 fl2va 档的杠杆差别:**这条 env 对 ref2va 是惰性的**(2026-09-29 实测)---
    #
    #   Ref2VA 接受具名 aspect_ratio、参考图不绑定输出画布,所以网关侧 h3ApplyCanvas
    #   会按 (短边, 比例) 推出 width/height 发过来,而引擎的
    #   `_resolve_output_canvas`(唯一读 `_allowed_output_short_edges()` 白名单的地方)
    #   **只在 height/width 都缺省时才会被调用**。实测(env 故意不设、只发显式画布):
    #
    #     width=1920 height=1056 → 200,出片 1920×1056(短边 1056,由 1920 的 area cap 反推)
    #
    #   也就是说 ref2va 这条路**不需要**这条 env 也能出 1080p —— 它在这里的作用只剩下
    #   "任何不带显式画布的直连 1080 请求不会被 400"。保留它是为了堵那条缝,不是为了
    #   让正常路径生效。fl2va 那边正相反:它的画布不由网关给,短边只能由请求字段给,
    #   两个都必需(见 fl2va 档的注释)。
    #
    # 注意上面发的是 1920×1056 而不是 1.75 比例的 1888×1088:ref2va 的档位由**具名比例**
    # 决定(t2v 那边同样),与 fl2va 跟随首图不同。网关 h3ApplyCanvas 算出什么就出什么。
    #
    # 显存:5s@1080p 在 2026-09-29 实测 torch max allocated 22.86 GiB、每步 driver
    # 余量 24.93/39.49 GiB(同档未开组件卸载时是 35.80 GiB)。1080p 的时长上限由
    # 部署方把握,网关侧不拦。
    #
    # ⚠️ 上面那组数是 **fl2va** 的。下面那张表同样出自 fl2va 那一档,而 ref2va 在
    # 同一形状下**更贵**:同为 15 秒 768p,ref2va 保留 37.4% 的 query-key 对
    # (124194 行)、fl2va 只保留 22.8%(111895 行),因为 ref2va 的全局行更多
    # (参考图+参考音频),而全局行在两个方向上都是稠密的 —— 全局行正是随时长线性涨
    # 的那一部分。所以 ref2va 的 1080p 时长上限**只会比 fl2va 的 20 秒更低**,
    # 且**未实测过**。要用这条档位出长片,先按同样的阶梯(15/18/20 s)自己夹一遍。
    #
    # --- fl2va 实测的 1080p 容量边界(2026-09-29,gpu36,单发,每发 restart 后冷启)---
    #   行数(used_len) 与时长近似线性:1080p 每条 video 行 ≈ 13,300/秒。
    #
    #     时长   video 行数   used_len   结果   末步 driver 余量 / torch max allocated
    #      5 s     76,228       —        ✅      24.93 GiB / 22.86 GiB
    #     15 s    216,648     219,941    ✅      12.33 GiB / 25.53 GiB
    #     18 s    266,798     270,375    ✅       7.48 GiB / 30.07 GiB
    #     20 s    286,858     290,549    ✅       6.03 GiB / 37.57 GiB
    #     22 s    316,948     320,713    ✅       0.35~0.70 GiB / 38.52 GiB  ← 悬崖边
    #     25 s    (357,068)    361,155   ❌ OOM
    #     30 s    (437,308)    441,849   ❌ OOM(需 37.41 GiB 常驻,只剩 1.23)
    #
    #   注意 15→20 秒这一段:时长只涨 33%,峰值却从 25.5 涨到 37.6 GiB(+47%) ——
    #   涨的是全局行(参考图/音频/文本)那部分,它随时长线性涨而窗口部分不涨。
    #   **可交付的 1080p 上限是 20 秒**,30 秒 × 1080p 在 4×A100-40G 上是硬件容量问题。
    #   30 秒要出片只能退 768p:同机实测 736 帧 / 30.667 s、整条 8 步余量
    #   12.0~12.9 GiB、diffuse 608.5 s。
    env:
      VLLM_OMNI_H3_EXPERIMENTAL_SHORT_EDGE: "1080"
      # 与 fl2va 档同一个理由:两个 VAE 每卡 10.26 GiB 常驻,8 步去噪从不碰它们。
      # 代价是每卡 10.26 GiB 主机内存,起服务前 drop_caches。
      # ⚠️ 它省的是**常驻**不是**峰值**:上表 20 秒档的 37.57 GiB 是去噪峰值,
      # 这一项对它没有作用,别把「省 13 GiB」误当成「还能再长」。
      VLLM_OMNI_H3_OFFLOAD_COMPONENTS: "1"

    enable_cpu_offload: true
    vae_use_tiling: true

    # 硬约束 1。换成 FLASH_ATTN 会在启动时被 validate_hybrid_runtime 拒绝，
    # 而不是安静地跑出错误结果。
    diffusion_attention_backend: VDN_WINDOW_ATTN

    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true

    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      # 硬约束 2：这两个必须留 1。
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1

    default_sampling_params:
      # stage-dmd-step-250 的 metadata.json 写的是 turbo_num_steps=8。
      # flow_shift 同样从那里读（12.0 / 音频 3.0），不在这里设 —— 写在这里会以
      # OmniDiffusionSamplingParams 不接受的字段名启动失败。
      num_inference_steps: 8
