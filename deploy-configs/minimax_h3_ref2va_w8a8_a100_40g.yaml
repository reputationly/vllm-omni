# MiniMax-H3 Ref2VA (offline serialized W8A8) — A100 PCIE 40G x4
#
# Weights:
#   /nfs-data/models/MiniMax-H3-Ref2VA-INT8
#
# The DiT checkpoint already contains per-output-channel INT8 weights and
# scales with dynamic activation quantization.  Pass no --quantization flag:
# doing so would select the online quantization path and attempt to quantize
# the serialized tensors again.  Shared text encoder and VAEs remain BF16.
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: ref2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    enable_cpu_offload: true
    vae_use_tiling: true
    diffusion_attention_backend: FLASH_ATTN
    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true
    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1

    default_sampling_params:
      num_inference_steps: 20
