# Minimax-h3_Singularity + VDN 8 步（社区微调 + 混合注意力 + 曲线剪枝 + INT8）
#   — DiT stage, A100 PCIE 40G x4
#
# 与 minimax_h3_vdn8_fl2va_pruned_a100_40g.yaml 的关系：同一档位、同样 19.5 GB，
# 区别只在**底座权重**换成了社区微调 WarmBloodAban/Minimax-h3_Singularity。
#
# --- 权重 ---
#   /nfs-data/models/MiniMax-H3-Singularity-VDN-INT8                   19.5 GB
#   --lora-path /nfs-data/models/VDN-MiniMax-H3/stage-dmd-step-250-curve-fl2va-baked2
#
#   注意 lora-path 用的是 **curve-fl2va** 那一套：Singularity 的 adaln_t_table 与我们
#   FL2VA 剪枝分区的曲线表**逐位相同**（相对差 0.0e+00），所以现成的 fl2va 投影直接
#   适用，不需要为它单独拟合。换成 curve-ref2va 那份不会报错，只会把 turbo 采样到
#   错误的调制上。
#
# --- 这份权重是什么 ---
#   作者称是 ref / fl / b25-49 多个 checkpoint 的融合 + 高步数微调，主打 HDR 画质、
#   去动态模糊、远景人脸修复、去油光、动作流畅度与 VFX。发布形态是 ComfyUI 单文件
#   （ConvRot-INT8），经 tools/minimax_h3/convert_comfy_convrot_to_partition.py 转成
#   分区格式，再烘 VDN、再量化。**血统是 FL2VA**（文件名虽写 ref2va）：一维张量与
#   FL2VA 逐位相同，与 Ref2VA 差 0.005。
#
# --- 为什么要配 VDN，而不是单用 ---
#   Singularity 是 50 步基座，**不含任何少步适配器**（作者建议自行配 4 步 turbo）。
#   同一提示词下实测：
#     单用  8 步  锐度  84.6   运动 12.78    205 s
#     单用 20 步  锐度 107.7   运动 18.60    517 s
#     单用 50 步  锐度 177.5   运动 20.30   1154 s   <- 它的天花板
#     +VDN  8 步  锐度 146.3   运动 22.10    166 s   <- 天花板的 82%，1/7 的时间
#   VDN 的 DMD turbo 补上了它缺的蒸馏。八个场景 × 三条臂的对照里，+VDN 赢 7 局，
#   唯一落后的是运镜（s5）。产物见 /nfs-output/vdn-h3/Singularity评测-20260909/。
#
# --- 硬约束（与 minimax_h3_vdn8_fl2va_pruned 完全相同）---
#   1. diffusion_attention_backend 必须是 VDN_WINDOW_ATTN，启动时 validate_hybrid_runtime 拦。
#   2. ulysses_degree / ring_degree 必须是 1，分支的扫描沿帧展开。
#   3. 必须开 VLLM_OMNI_VDN_ALLOW_UNTRAINED_TASKS=1。
#   4. flow_shift 不在这里设，从制品 metadata.json 读（12.0 / 音频 3.0）。
#   显存两项同样必需：
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#     VLLM_OMNI_VDN_KV_GATHER_BUDGET_MB=192
#
# --- 提示词格式（这一条只在这里记，但对所有 H3 档都成立）---
#   官方 prompts/image/example_fl2va.pt 里的真实字符串是：
#     How the reference pictures align with the target video — Picture 1 (from Shot 1)
#     aligns with the 0.00-second mark ...; Picture 2 ... aligns with the S.SS-second mark ...
#
#     integrated_multimodal_description: [Shot 1] ...
#     overall_soundscape: ...
#     non_diegetic_music: ...
#   即：**关键帧指令行在最前**，正文字段名是 integrated_multimodal_description /
#   overall_soundscape / non_diegetic_music（不是 Soundscape: / Music:），时间戳写
#   实际时长。指令行由门面补（new-api 里三条已逐字在库），直连引擎的请求会缺。
#
# --- 许可 ---
#   README 声明 apache-2.0，但底座 MiniMax-H3 是 MiniMax H3 Community License，
#   带地域限制（排除 EU/UK/KR/US）。派生物单方声明不解除底座许可。
#
# --- 挪不进本文件的东西 ---
#   VLLM_OMNI_* 环境变量、--init-timeout / --stage-init-timeout、--lora-path，
#   原因见 minimax_h3_a100_40g.yaml 的注释。
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: fl2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    # 短边 1080 生成档。**追加式**：768 仍然合法，所以这台服务器既能收既有请求，
    # 也能收 1080p 的请求。
    #
    # --- 这条 env 只是**白名单**，它单独不能让 fl2va 出 1080p（2026-09-29 实测）---
    #   引擎里短边的缺省值是**常量**，env 只决定某个值**合法不合法**：
    #
    #     encoder_processing.py:208  target.get("short_edge", extra.get("short_edge", 768))
    #     pipeline_minimax_h3.py:2215  同一份常量、同一条读取链
    #
    #   同机、同为 5 秒档、短边只此一处变化，四条实测：
    #
    #     部署 env   请求 short_edge   结果
    #      未设         未传            200  1344×768
    #      未设         1080            400  `must be one of (768,), got 1080`
    #     1080         未传            200  1344×768   ← env 不改缺省值
    #     1080         1080            200  1888×1088  ← 画幅仍跟随首图
    #
    #   所以本 env 与**网关下发的 `extra_params.short_edge`** 缺一不可：少了网关那一半，
    #   用户点了 1080P 会静默拿到 768p（最坏的一种，界面无提示）；少了这条 env，请求是
    #   硬 400（好查）。网关侧见 new-api 的 `h3ApplyKeyframeShortEdge`（90daec63a）。
    #
    # 为什么由网关发短边而不是改画布：FL2VA 的 aspect_ratio **永远取自首图**，网关侧
    # h3ApplyCanvas 对关键帧不推画布。发短边不碰画幅 —— 首图仍是唯一的比例来源，不会被
    # 拉伸。改用显式 width/height 就会把首图拉伸到另一个比例，那是 h3ApplyCanvas 注释里
    # 明确否决过的做法。
    #
    # 出片尺寸是**短边 1080 + 首图比例**，不是 16:9 的 1920×1056：1.75 比例的首图 ->
    # 1888×1088（2026-09-29 实测）。别按请求里的 aspect_ratio 反推。
    #
    # --- 1080p 的时长上限是 **20 秒**（2026-09-29 实测，本底座同档）---
    #   fl2va VDN-INT8、单发、每发重启后冷启，末步 driver 余量 / torch max allocated：
    #
    #      5 s ✅ 24.93 / 22.86 GiB    15 s ✅ 12.33 / 25.53 GiB
    #     18 s ✅  7.48 / 30.07 GiB    20 s ✅  6.03 / 37.57 GiB
    #     22 s ✅  0.35 / 38.52 GiB ← 悬崖边     25 s ❌ / 30 s ❌ OOM
    #
    #   涨的不是窗口部分而是**全局行**（参考图/音频/文本）—— VDN 对全局行在两个方向上
    #   都是稠密的，而它随时长线性涨。所以 15→20 秒时长只涨 33%、峰值涨 47%。
    #   30 秒只能退 768p：实测 736 帧 / 30.667 s、整条 8 步余量 12.0~12.9 GiB。
    #
    #   ⚠️ 这张表是 **full 模式**。continuation 模式（只有 ref2va 收）的显存由**单窗**
    #   决定、与总时长无关，那套数**不适用于本表**，也**尚未实测**。
    #
    # 顺带：这张表出自自研档（`MiniMax-H3-FL2VA-Pruned-VDNfull-INT8`）的实测，本档是
    # Singularity 底座。两者同为 19.5 GB / 同套 VDN 窗口，量级可比；但**上限要按本档
    # 复测一遍再定** —— 别把对照档的数直接当本档的承诺。
    env:
      VLLM_OMNI_H3_EXPERIMENTAL_SHORT_EDGE: "1080"
      # The two VAEs are 10.26 GiB per rank and the denoise steps never touch them, but
      # `_component_on_device` only stages them when this is set: the staging path used to be
      # gated behind layerwise offload, which is a different job (streaming the DiT's blocks)
      # that this deployment does not want. Measured at 15s@1080p: denoise peak 35.79 ->
      # 25.53 GiB, warm 708s -> 629s. Costs 10.26 GiB per rank of HOST memory instead, so
      # drop caches before starting if the box has been reading checkpoints all day.
      VLLM_OMNI_H3_OFFLOAD_COMPONENTS: "1"

    enable_cpu_offload: true
    vae_use_tiling: true

    # 硬约束 1。
    diffusion_attention_backend: VDN_WINDOW_ATTN

    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true

    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      # 硬约束 2：这两个必须留 1。
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1

    default_sampling_params:
      # VDN 的 turbo 是 8 步；flow_shift 同样从制品的 metadata.json 读，见硬约束 4。
      num_inference_steps: 8
