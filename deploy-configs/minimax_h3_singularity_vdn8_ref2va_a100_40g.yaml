# Minimax-h3_Singularity + VDN 8 步（社区微调 + 混合注意力 + 曲线剪枝 + INT8）
#   — DiT stage, A100 PCIE 40G x4，ref2va
#
# 与 minimax_h3_singularity_vdn8_fl2va_a100_40g.yaml 是同一份底座的两个任务，
# 差别只在 task_type 和参考图封顶那一个环境变量。
#
# --- 权重 ---
#   /nfs-models/wuhanjisuan894/models/MiniMax-H3-Singularity-VDN-INT8-ref2va   19.5 GB
#   --lora-path /nfs-models/wuhanjisuan894/models/VDN-MiniMax-H3/stage-dmd-step-250-curve-fl2va-baked2
#
#   **lora 用 curve-fl2va，不是 curve-ref2va。** 这一条和自研的
#   minimax_h3_vdn8_ref2va_pruned_a100_40g.yaml 恰好相反，容易照着改错：
#
#     自研 ref2va 制品  -> 曲线表是 Ref2VA 分区自己拟合的 -> 必须 curve-ref2va
#     Singularity      -> 血统是 FL2VA（一维张量与 FL2VA 逐位相同，与 Ref2VA 差
#                         0.005），adaln_t_table 与我们 FL2VA 剪枝分区**逐位相同**
#                         （相对差 0.0e+00）           -> 必须 curve-fl2va
#
#   曲线拟合是按分区做的，拿错分区的投影加载不会报错，只会把 turbo 采样到错误的
#   调制上。判据不是文件名（Singularity 的文件名写着 ref2va），是曲线表逐位比对。
#
# --- 为什么在 ref2va 上换这份底座 ---
#   它同时赢了两根轴：锐度 108.6 对 60.1，**对参考图首帧保真 0.709 对 0.214**。
#   后者是自研 ref2va VDN 制品一直落后的那根轴，曾以为是"跨分区未验证迁移的必然
#   代价"，换底座后两样一起拿到了，说明那个代价不是必然的。
#
# --- 硬约束（与自研 ref2va 那份完全相同，配错不报错只出错片）---
#   1. diffusion_attention_backend 必须是 VDN_WINDOW_ATTN，启动时 validate_hybrid_runtime 拦。
#   2. ulysses_degree / ring_degree 必须是 1，分支的扫描沿帧展开，用 TP 切头。
#   3. 必须显式开 VLLM_OMNI_VDN_ALLOW_UNTRAINED_TASKS=1：VDN 适配器没有在 ref2va 的
#      那份 DiT 上训练过。
#   4. flow_shift 不在这里设，从制品 metadata.json 读（12.0 / 音频 3.0），启动时会
#      覆盖 ref2va 分区声明的 6.0 并打日志。别照抄现网 ref2va 的请求参数去测——
#      现网静默忽略请求里的 flow_shift，VDN 不会。
#
# --- 显存：三个环境变量都是必需的，不是调优 ---
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#     VLLM_OMNI_VDN_KV_GATHER_BUDGET_MB=192            （默认 512）
#     VLLM_OMNI_H3_REF_IMAGE_MAX_PIXELS=1032192        （fl2va 不需要）
#
#   第三个的理由见 minimax_h3_vdn8_ref2va_pruned_a100_40g.yaml，不重复。要点是参考图
#   是唯一没有面积封顶的一条路，不设时 9 图的行为是"第一条能用、第二条 OOM"，
#   空闲实例过、忙过的实例崩，验收测一发发现不了。
#
# --- 现网实测（0039，开封顶后）---
#   9 图                481 s / 399 s   连发两条都过
#   9 图 + 3 视频        396 s          契约上限（<=9图 <=3视频 <=3音频 且总数 <=12）
#
# --- 许可 ---
#   README 声明 apache-2.0，但底座 MiniMax-H3 是 MiniMax H3 Community License，
#   带地域限制（排除 EU/UK/KR/US）。派生物单方声明不解除底座许可。
#
# --- 挪不进本文件的东西 ---
#   VLLM_OMNI_* 环境变量、--init-timeout / --stage-init-timeout、--lora-path，
#   原因见 minimax_h3_a100_40g.yaml 的注释。
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: ref2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    # 短边 1080 生成档，**追加式**（768 仍然合法）。
    #
    # ⚠️ **本档是 ref2va，而这条 env 对 ref2va 是惰性的**（2026-09-29 实测）。Ref2VA
    #   接受具名 aspect_ratio、参考图不绑定输出画布，所以网关侧 h3ApplyCanvas 会按
    #   （短边, 比例）推出 width/height 发过来；而引擎的 `_resolve_output_canvas` ——
    #   唯一读 `_allowed_output_short_edges()` 白名单的地方 —— **只在 height/width 都
    #   缺省时才会被调用**。实测（env 故意不设、只发显式画布）：
    #
    #     width=1920 height=1056 → 200，出片 1920×1056
    #
    #   也就是说 ref2va 不需要这条 env 也能出 1080p；留着的唯一用途是堵"任何不带显式
    #   画布的直连 1080 请求会被 400"那条缝。fl2va 那边正相反（画布不由网关给、短边
    #   只能由请求字段给），两个都必需。
    #
    # --- continuation（长视频）与 1080p 的关系，见本文件末尾的专段 ---
    env:
      VLLM_OMNI_H3_EXPERIMENTAL_SHORT_EDGE: "1080"
      # The two VAEs are 10.26 GiB per rank and the denoise steps never touch them, but
      # `_component_on_device` only stages them when this is set: the staging path used to be
      # gated behind layerwise offload, which is a different job (streaming the DiT's blocks)
      # that this deployment does not want. Measured at 15s@1080p: denoise peak 35.79 ->
      # 25.53 GiB, warm 708s -> 629s. Costs 10.26 GiB per rank of HOST memory instead, so
      # drop caches before starting if the box has been reading checkpoints all day.
      VLLM_OMNI_H3_OFFLOAD_COMPONENTS: "1"

    enable_cpu_offload: true
    vae_use_tiling: true

    # 硬约束 1。
    diffusion_attention_backend: VDN_WINDOW_ATTN

    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true

    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      # 硬约束 2：这两个必须留 1。
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1

    default_sampling_params:
      # VDN 的 turbo 是 8 步；flow_shift 同样从制品的 metadata.json 读，见硬约束 4。
      num_inference_steps: 8

# ─────────────────────────────────────────────────────────────────────────────
# 长视频：只有本档（ref2va）能用 continuation，而且**必须改网关**才能到 30 秒以上
# ─────────────────────────────────────────────────────────────────────────────
# 引擎的三档时长常量（`model_executor/models/minimax_h3/long_video.py`）：
#
#   long_video 未开                  → 15 s
#   long_video=true + full           → 30 s
#   long_video=true + continuation   → 300 s，**仅 Ref2VA**
#
# **fl2va 没有 continuation 这条路**：`continuation.py:57` 对 `task != "ref2va"` 直接
# raise。所以 fl2va 的上限硬停在 30 秒（full），这不是取舍，是引擎约束。
#
# ## 未给 mode 时的默认值是 continuation —— 是我们的网关把它按成 full 的
#
#   mode = extra.get("long_video_mode", "continuation" if long_video and task == "ref2va" else "full")
#
# 网关（new-api `minimax_h3.go`）现在无条件注入 `long_video_mode="full"`，于是
# **>30 秒的 ref2va 请求现在必然 400**（full 的上限就是 30）。要在本档出 30 秒以上，
# 注入规则得改成：
#
#   durationSec > 15 且 ≤ 30  → long_video=true + full
#   durationSec > 30          → long_video=true + continuation
#
# 这条规则不需要新配置字段：>30 秒**只有** continuation 能表达，而它**只有** ref2va 收，
# 万一有 fl2va 请求漏进 >30 那段，引擎会响亮地 400（`continuation requires Ref2VA`），
# 不会静默出错误档位 —— 比在网关里自己判断任务类型更简单也更安全。
#
# ## 两个必须一起看的前提
#
# 1. **不许装 Cache-DiT**（`pipeline:3911`）：
#      if continuation is not None and quality_plan.cache_dit is not None: raise ...
#    报错文案是 `set quality=lossless`，但网关**正在把 quality 键删掉**（那行是因为
#    `quality=high` 撞 cpu_offload 会废掉实例）。目前两道闸都关着：源码里
#    `MINIMAX_H3_CACHE_DIT_ENABLED = False`，且本档没有 `cache_backend`。
#    ⚠️ **给本档加 `cache_backend: cache_dit` 会让 continuation 全线 400**，而报错会把人
#    引向一个已经被网关删掉的键。加它之前必须先解决这条链。
#
# 2. **不许用 latent-mask 编辑**（`encoder_processing.py:516`，编码期就拦）。参考图 +
#    参考音频 + 提示词这条路不涉及，不是障碍；只有 `video_noise_mask` /
#    `audio_noise_mask` 那些玩法受影响。step execution 也收（本档没开）。
#
# ## 耗时：逐窗累加，会撞穿默认超时
#
# 每窗 = 一个独立去噪（窗口 277 帧、约 115k 行，与 15s@768p full 同量级，那一档实测
# 361~394 s/条）。窗口数按 `plan_continuation_windows`（默认 window=277 / overlap=22）：
#
#   输出 30 s → 736 帧 → **3 窗**   ≈ 18 分钟
#   输出 75 s → 1807 帧 → **7 窗**  ≈ 43 分钟（7 是上游 recipe 给的数）
#   输出 300 s → 7213 帧 → **29 窗** ≈ **3 小时**（外推，未实测）
#
# 所以本档要开 30 秒以上，`VLLM_OMNI_VIDEO_SYNC_TIMEOUT` 的 7200（2 小时）**会被 300 秒
# 档撞穿**：要提到 ≥14400。`VLLM_OMNI_DLO_DP_WAVE_TIMEOUT` 也建议一并对齐到 14400
# （单窗 370 s 用 7200 够，但既然要出长片，让两道墙同高更好排查）。
# 网关侧的准入时延必须**按模型配**（`lightx2v_model_latency_seconds` /
# `lightx2v_model_queue_wait_seconds`）—— video 类默认估时 90 s / 容忍 150 s，
# 会让 29 窗的任务被 429 误拒。
#
# ## 显存：由**单窗**决定，与总时长无关 —— 但**本档没测过**
#
# 上游 recipe 原话：`Denoising memory is bounded by the window, while cumulative latent
# storage still grows with duration.` 窗口里 `num_frames` 被换成该窗的帧数，所以去噪
# 显存只由（窗口 277 + guide 22 + 参考媒体/文本）决定。注意 guide 是**条件块**，VDN 对
# 非 target 区间双向稠密，所以它不是"两个短视频叠加"那么便宜；粗算 used_len 约 115k，
# 约为 30s@768p full（223k）的一半。
#
# ⚠️ 上面全是**读代码 + 上游文档**推的，**本档一发都没跑过**。fl2va 那套 1080p 时长阶梯
# （20 s 可用 / 22 s 悬崖 / 25 s OOM）是 **full 模式**的数，**不适用于 continuation**，
# 反向也不成立。上线前先跑一发 **60 s @768p**：一次能同时验窗口数是否 = 6、每窗的
# `driver free` / `torch max allocated`、以及耗时外推对不对。1080p 要等 768p 的曲线拉出来。
