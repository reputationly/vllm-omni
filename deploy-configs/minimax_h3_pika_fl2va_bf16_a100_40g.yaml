# MiniMax-H3 Pika FL2VA (BF16) — A100 PCIE 40G x4
#
# Pika official FL2VA BF16 deployment (Pika-H3-Flex-FL2VA-BF16-vLLM), captured
# from the tested `pika-show-fl2va` service.  The only difference from the
# shared `minimax_h3_fl2va_bf16_a100_40g.yaml` is the keyframe mode:
# `source_center_crop` reproduces the Pika CLI (`keyframe_fit="crop"`): every
# keyframe is centre-cropped in source space to the canvas aspect, then
# LANCZOS-resized.  Stage env wins over container env for the same key.
#
# Container env used with this profile in testing (pass it on the container,
# not here): PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,
# VLLM_OMNI_H3_VAE_REVERT_FRAME_CHUNK=8, VLLM_OMNI_H3_OFFLOAD_DIT_BEFORE_VAE=1,
# VLLM_OMNI_DLO_DP_WAVE_TIMEOUT=7200, VLLM_OMNI_ASYNC_OUTPUT_TIMEOUT_S=7200,
# VLLM_OMNI_VIDEO_SYNC_TIMEOUT=7200, VLLM_OMNI_INPUT_WAIT_TIMEOUT_S=0.
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: fl2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    env:
      VLLM_OMNI_H3_FL2VA_KEYFRAME_RESIZE: source_center_crop

    enable_cpu_offload: true
    vae_use_tiling: true
    diffusion_attention_backend: FLASH_ATTN
    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true
    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
