# MOSS-TTSD-v1.0 on A100 PCIE 40G ×2 —— 从官方 moss_ttsd.yaml 改:两 stage 分卡。
# 上游默认两 stage 同卡(devices "0"),8B talker + codec 在单张 40G 上 OOM
# (官方 recipe 面向 H100 80G)。这里 stage0(8B talker)独占 card0、stage1(codec)
# 独占 card1,各自一整张 40G,恢复原始高性能配置(stage0 0.85 / max_num_seqs 4)。
# 起容器时需 --gpus '"device=0,1"' 暴露两张卡。
async_chunk: true
trust_remote_code: true

connectors:
  shm:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 0

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.85
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: shm
    default_sampling_params:
      temperature: 1.7
      top_p: 0.8
      top_k: 25
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.30
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 196608
    max_model_len: 196608
    devices: "1"
    input_connectors:
      from_stage_0: shm
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
