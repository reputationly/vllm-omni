# VDN-MiniMax-H3 FL2VA 8 步（混合注意力 + 曲线剪枝 r8 + INT8 W8A16）— DiT stage, A100 PCIE 40G x4
#
# 这是替换现网 fl2va（Turbo8 + 剪枝r8）的那一档，也取代同目录下的
# minimax_h3_vdn8_fl2va_int8_a100_40g.yaml（未剪枝，43.8 GB，峰值 39.1/39.5 GiB —
# 余量只剩 0.4 GiB，不适合上线）。
#
# --- 权重 ---
#   /nfs-data/models/MiniMax-H3-FL2VA-Pruned-VDNfull-INT8              19.5 GB
#   --lora-path /nfs-data/models/VDN-MiniMax-H3/stage-dmd-step-250-curve-fl2va-baked
#
#   两个都必须是 -curve-fl2va 那一套，不能拿 t2va/ref2va 的：AdaLN 的曲线拟合是**按
#   分区**做的（每个分区有自己的 time_embedder），拿错分区的投影结果加载不会报错，
#   只会把 turbo 采样到错误的调制上。
#
# --- 制作链路（fl2va 比 ref2va 多两步，因为它的剪枝底座是 diffusers 命名）---
#   1. project_vdn_turbo_to_pruned_curve.py  turbo 的 51 个 AdaLN 更新投到 8 维曲线
#   2. bake_vdn_adapters.py                  烘进 Pruned-r8-BF16-vLLM（37.5 GB BF16）
#   3. minimax_h3_turbo/convert_pruned_to_partition.py   diffusers 命名 -> 原生命名
#   4. quantize_minimax_h3_int8.py --activation-scheme weight_only   37.5 -> 19.5 GB
#   第 3 步是必须的：量化器按**分区名**（blocks.N.attn.qkv_proj.weight）匹配张量，
#   对着 diffusers 命名的目录跑会匹配到 0 个张量并报「matched no tensors」。
#
# --- 为什么能同时剪枝和上 VDN ---
#   剪枝把 51 个 AdaLN 投影的输入从 2688 维时间嵌入换成 8 维采样表，而 VDN 的 turbo
#   适配器带的是 [out, 2688] 的 delta，形状对不上。turbo 是 DMD 阶段以冻结的 Stage-B
#   VDN 为 real score 蒸出来的，和线性分支是一对，换成别的少步适配器就是拆对。
#
#   解法是把 delta 也换算到那 8 维坐标里。可行的原因是 AdaLN 的输入不是任意向量：
#   它是 silu(time_embedder(t))，一次生成里只取 1025 个离散值，所以只要在这 1025 个
#   点上拟合，而且必须是**仿射**（带截距）——纯线性拟合的相对残差是 0.9978，加上一列
#   常数变成 1.5e-05。省显存的是剪枝，投影只是让两者能共存。
#
# --- 硬约束（配错不会报错，只会渲染出「看着正常但不是这个模型」的片子）---
#   1. diffusion_attention_backend 必须是 VDN_WINDOW_ATTN。线性分支是窗口的补集，
#      配稠密 attention 会把窗口外的帧算两遍。启动时 validate_hybrid_runtime 拦。
#   2. ulysses_degree / ring_degree 必须是 1。分支的扫描沿帧展开，需要每张卡都有
#      完整的目标视频行。用 TP 切头。
#   3. fl2va 是 VDN **没有训练过**的任务（参考媒体行落在分支没见过的 prefix 里），
#      必须显式开 VLLM_OMNI_VDN_ALLOW_UNTRAINED_TASKS=1，每次请求都会告警。首帧保真
#      实测没问题（对参考帧第 0 帧 PSNR 36.43 dB，dense 对照 36.52）。
#   4. flow_shift 不在这里设：制品的 metadata.json 声明 12.0（音频 3.0），管线启动时
#      读它并覆盖分区的声明值，同时打日志。写进 default_sampling_params 会因为
#      OmniDiffusionSamplingParams 不接受这个字段名而启动失败。
#
# --- 显存 ---
#   官方多镜头长 prompt 会顶穿 40G：VDN 的窗口对全局行（文本/音频/参考图）双向稠密，
#   所以显存随 prompt 长度涨，单句 prompt 测不出来。下面两个环境变量是必需的，不是调优：
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#     VLLM_OMNI_VDN_KV_GATHER_BUDGET_MB=192          （默认 512）
#   日志里出现「reserved but unallocated 3.5 GiB」就是该开 expandable_segments 的信号。
#   注意跑完再采 nvidia-smi 得到的是 DiT offload 之后的数，不是峰值，别拿它判余量。
#
# --- fl2va 的窗口比 ref2va 更省 ---
#   同为 15 秒 768p，fl2va 保留 22.8% 的 query-key 对（111895 行），ref2va 是 37.4%
#   （124194 行）—— fl2va 的全局行更少（一张参考图 vs 参考图+参考音频），而全局行在
#   两个方向上都是稠密的。所以 VDN 在 fl2va 上的收益比 ref2va 更大。
#
# --- 许可 ---
#   MiniMax H3 Community License，带地域限制（排除 EU/UK/KR/US），商用前过法务。
#
# --- 挪不进本文件的东西 ---
#   VLLM_OMNI_* 环境变量、--init-timeout / --stage-init-timeout、--lora-path，
#   原因见 minimax_h3_a100_40g.yaml 的注释，此处不重复。
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: fl2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    enable_cpu_offload: true
    vae_use_tiling: true

    # 硬约束 1。换成 FLASH_ATTN 会在启动时被 validate_hybrid_runtime 拒绝，
    # 而不是安静地跑出错误结果。
    diffusion_attention_backend: VDN_WINDOW_ATTN

    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true

    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      # 硬约束 2：这两个必须留 1。
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1

    default_sampling_params:
      # stage-dmd-step-250 的 metadata.json 写的是 turbo_num_steps=8。
      # flow_shift 同样从那里读（12.0 / 音频 3.0），见硬约束 4。
      num_inference_steps: 8
