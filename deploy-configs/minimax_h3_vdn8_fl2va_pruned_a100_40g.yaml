# VDN-MiniMax-H3 FL2VA 8 步（混合注意力 + 曲线剪枝 r8 + INT8 W8A16）— DiT stage, A100 PCIE 40G x4
#
# 这是替换现网 fl2va（Turbo8 + 剪枝r8）的那一档，也取代同目录下的
# minimax_h3_vdn8_fl2va_int8_a100_40g.yaml（未剪枝，43.8 GB，峰值 39.1/39.5 GiB —
# 余量只剩 0.4 GiB，不适合上线）。
#
# --- 权重 ---
#   /nfs-data/models/MiniMax-H3-FL2VA-Pruned-VDNfull-INT8              19.5 GB
#   --lora-path /nfs-data/models/VDN-MiniMax-H3/stage-dmd-step-250-curve-fl2va-baked
#
#   两个都必须是 -curve-fl2va 那一套，不能拿 t2va/ref2va 的：AdaLN 的曲线拟合是**按
#   分区**做的（每个分区有自己的 time_embedder），拿错分区的投影结果加载不会报错，
#   只会把 turbo 采样到错误的调制上。
#
# --- 制作链路（fl2va 比 ref2va 多两步，因为它的剪枝底座是 diffusers 命名）---
#   1. project_vdn_turbo_to_pruned_curve.py  turbo 的 51 个 AdaLN 更新投到 8 维曲线
#   2. bake_vdn_adapters.py                  烘进 Pruned-r8-BF16-vLLM（37.5 GB BF16）
#   3. minimax_h3_turbo/convert_pruned_to_partition.py   diffusers 命名 -> 原生命名
#   4. quantize_minimax_h3_int8.py --activation-scheme weight_only   37.5 -> 19.5 GB
#   第 3 步是必须的：量化器按**分区名**（blocks.N.attn.qkv_proj.weight）匹配张量，
#   对着 diffusers 命名的目录跑会匹配到 0 个张量并报「matched no tensors」。
#
# --- 为什么能同时剪枝和上 VDN ---
#   剪枝把 51 个 AdaLN 投影的输入从 2688 维时间嵌入换成 8 维采样表，而 VDN 的 turbo
#   适配器带的是 [out, 2688] 的 delta，形状对不上。turbo 是 DMD 阶段以冻结的 Stage-B
#   VDN 为 real score 蒸出来的，和线性分支是一对，换成别的少步适配器就是拆对。
#
#   解法是把 delta 也换算到那 8 维坐标里。可行的原因是 AdaLN 的输入不是任意向量：
#   它是 silu(time_embedder(t))，一次生成里只取 1025 个离散值，所以只要在这 1025 个
#   点上拟合，而且必须是**仿射**（带截距）——纯线性拟合的相对残差是 0.9978，加上一列
#   常数变成 1.5e-05。省显存的是剪枝，投影只是让两者能共存。
#
# --- 硬约束（配错不会报错，只会渲染出「看着正常但不是这个模型」的片子）---
#   1. diffusion_attention_backend 必须是 VDN_WINDOW_ATTN。线性分支是窗口的补集，
#      配稠密 attention 会把窗口外的帧算两遍。启动时 validate_hybrid_runtime 拦。
#   2. ulysses_degree / ring_degree 必须是 1。分支的扫描沿帧展开，需要每张卡都有
#      完整的目标视频行。用 TP 切头。
#   3. fl2va 是 VDN **没有训练过**的任务（参考媒体行落在分支没见过的 prefix 里），
#      必须显式开 VLLM_OMNI_VDN_ALLOW_UNTRAINED_TASKS=1，每次请求都会告警。首帧保真
#      实测没问题（对参考帧第 0 帧 PSNR 36.43 dB，dense 对照 36.52）。
#   4. flow_shift 不在这里设：制品的 metadata.json 声明 12.0（音频 3.0），管线启动时
#      读它并覆盖分区的声明值，同时打日志。写进 default_sampling_params 会因为
#      OmniDiffusionSamplingParams 不接受这个字段名而启动失败。
#
# --- 显存 ---
#   官方多镜头长 prompt 会顶穿 40G：VDN 的窗口对全局行（文本/音频/参考图）双向稠密，
#   所以显存随 prompt 长度涨，单句 prompt 测不出来。下面两个环境变量是必需的，不是调优：
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#     VLLM_OMNI_VDN_KV_GATHER_BUDGET_MB=192          （默认 512）
#   日志里出现「reserved but unallocated 3.5 GiB」就是该开 expandable_segments 的信号。
#   注意跑完再采 nvidia-smi 得到的是 DiT offload 之后的数，不是峰值，别拿它判余量。
#
# --- fl2va 的窗口比 ref2va 更省 ---
#   同为 15 秒 768p，fl2va 保留 22.8% 的 query-key 对（111895 行），ref2va 是 37.4%
#   （124194 行）—— fl2va 的全局行更少（一张参考图 vs 参考图+参考音频），而全局行在
#   两个方向上都是稠密的。所以 VDN 在 fl2va 上的收益比 ref2va 更大。
#
# --- 许可 ---
#   MiniMax H3 Community License，带地域限制（排除 EU/UK/KR/US），商用前过法务。
#
# --- 挪不进本文件的东西 ---
#   VLLM_OMNI_* 环境变量、--init-timeout / --stage-init-timeout、--lora-path，
#   原因见 minimax_h3_a100_40g.yaml 的注释，此处不重复。
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    task_type: fl2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    # 短边 1080 生成档。**追加式**:768 仍然合法，所以这台服务器既能收既有请求，
    # 也能收 1080p 的请求。
    #
    # --- 这条 env 只是**白名单**，它单独不能让 fl2va 出 1080p（2026-09-29 实测更正）---
    #   引擎里短边的缺省值是**常量**，env 只决定某个值**合法不合法**：
    #
    #     encoder_processing.py:208  target.get("short_edge", extra.get("short_edge", 768))
    #     pipeline_minimax_h3.py:2215  同一份常量、同一条读取链
    #
    #   同机、同为 5 秒档、短边只此一处变化，四条实测：
    #
    #     部署 env   请求 short_edge   结果
    #      未设         未传            200  1344×768
    #      未设         1080            400  `must be one of (768,), got 1080`
    #     1080         未传            200  1344×768   ← env 不改缺省值
    #     1080         1080            200  1888×1088  ← 画幅仍跟随首图
    #
    #   所以本 env 与**网关下发的 `extra_params.short_edge`** 缺一不可：少了网关那一半，
    #   用户点了 1080P 会静默拿到 768p（最坏的一种，界面无提示）；少了这条 env，请求是
    #   硬 400（好查）。网关侧见 new-api 的 `h3ApplyKeyframeShortEdge`。
    #
    #   ⚠️ 这支杠杆**只有 fl2va（以及其它画布跟随首图的玩法）需要**。ref2va 的画布由
    #   网关按具名比例算好、以显式 width/height 发过来，而白名单只在引擎自己算画布时
    #   才被读 —— 同机实测：env 不设、只发 width=1920/height=1056，照样 200 出 1920×1056。
    #   两份 YAML 都留着这条 env，但理由不同：fl2va 是必需，ref2va 只是堵直连的缝。
    #
    # 为什么由网关发短边而不是改画布：FL2VA 的 aspect_ratio **永远取自首图**
    # （`resolve_minimax_h3_aspect_ratio` 对 fl2va 直接返回 image 的宽高比，请求里传的
    # 具名比例被静默忽略），而网关侧 h3ApplyCanvas 对关键帧不推画布。发短边不碰画幅 ——
    # 首图仍是唯一的比例来源，不会被拉伸。改用显式 width/height 就会把首图拉伸到另一个
    # 比例，那是 h3ApplyCanvas 注释里明确否决过的做法。
    #
    # 出片尺寸是**短边 1080 + 首图比例**，不是 16:9 的 1920×1056：
    #   1.75 比例的首图 -> 1888×1088（2026-09-29 实测，与 09-19 的 76,228 视频行数
    #   逐位一致）；16:9 的首图才会出 1920×1056。别按请求里的 aspect_ratio 反推。
    #
    # --- ⚠️ 1080p 的容量边界是**显存**，且已在 20 秒附近夹死（2026-09-29 实测）---
    #   行数(used_len) 与时长近似线性：1080p 每条 video 行 ≈ 13,300/秒。
    #   同一台机器、同一个 fl2va 档、单发、每发都 restart 后的干净进程：
    #
    #     时长   video 行数   used_len   结果   末步 driver 余量 / torch max allocated
    #      5 s     76,228       —        ✅      24.93 GiB / 22.86 GiB
    #     15 s    216,648     219,941    ✅      12.33 GiB / 25.53 GiB
    #     18 s    266,798     270,375    ✅       7.48 GiB / 30.07 GiB
    #     20 s    286,858     290,549    ✅       6.03 GiB / 37.57 GiB
    #     22 s    316,948     320,713    ✅       0.35~0.70 GiB / 38.52 GiB  ← 悬崖边
    #     25 s    (357,068)    361,155   ❌ OOM
    #     30 s    (437,308)    441,849   ❌ OOM（需 37.41 GiB 常驻，只剩 1.23）
    #
    #   注意 15→20 秒这一段：时长只涨 33%，峰值却从 25.5 涨到 37.6 GiB（+47%），
    #   因为 VDN 的**全局行（参考图/音频/文本）在两个方向上都是稠密的**，这部分
    #   开销随时长线性涨而窗口部分不涨。22 秒只剩 0.35 GiB，实际不可交付。
    #
    #   **可交付的 1080p 时长上限：20 秒**（22 秒技术上能出片但没有余量，
    #   换一条官方多镜头长 prompt 就会顶穿）。**30 秒 × 1080p 在 4×A100-40G 上
    #   无论如何都做不到**，这是硬件容量而不是某个开关没打开。
    #
    #   30 秒要出片只有 768p 这一条路：同机实测 30 s @ 768p 过，736 帧 / 30.667 s
    #   （`17n+5` 栅格上）、整条 8 步 `driver free` 稳定在 12.0~12.9 GiB、
    #   `torch max allocated` 25.92 GiB、diffuse 608.5 s、端到端 667 s。
    #
    #   另有一个**已复现但尚未定性的偶发失败**：1080p × 30 s 在**非** CUDA_LAUNCH_BLOCKING
    #   下曾以 `CUDA error: an illegal memory access` 崩在 VDN 窗口分支的
    #   `flash_attn_varlen_func`（vdn_window_attn.py:311 → flash_attn）。同样形状在
    #   CUDA_LAUNCH_BLOCKING=1 下、以及作为干净进程的第一条请求发时，都稳定复现为
    #   **干净的 OOM**。所以 30 s@1080p 本来就出不来，这个越界目前只污染到那个
    #   已不可达的形状；但它是否会在 20 s 以内偶发，**没有验证过**，别当成已被排除。
    env:
      VLLM_OMNI_H3_EXPERIMENTAL_SHORT_EDGE: "1080"
      # 两个 VAE 每卡 10.26 GiB 常驻，而 8 步去噪从不碰它们。2026-09-29 在 gpu36 上
      # 实测 5s@1080p：torch max allocated 22.86 GiB、每步 driver 余量
      # 24.93/39.49 GiB（同一档 09-19 未开此项时是 35.80 GiB，**省约 13 GiB**）。
      # 代价是每卡 10.26 GiB 的**主机**内存，起服务前 drop_caches。
      #
      # ⚠️ 它省的是**常驻**，不是**峰值**：上表里 20 秒档的 37.57 GiB 是去噪峰值，
      # 这一项在何峰值上不起作用（09-19 报告 §10 已说明峰值换了阶段）。别把
      # 「省 13 GiB」误当成「1080p 还能再长」——延长时长撞的是另一堵墙。
      VLLM_OMNI_H3_OFFLOAD_COMPONENTS: "1"

    enable_cpu_offload: true
    vae_use_tiling: true

    # 硬约束 1。换成 FLASH_ATTN 会在启动时被 validate_hybrid_runtime 拒绝，
    # 而不是安静地跑出错误结果。
    diffusion_attention_backend: VDN_WINDOW_ATTN

    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true

    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      # 硬约束 2：这两个必须留 1。
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1

    default_sampling_params:
      # stage-dmd-step-250 的 metadata.json 写的是 turbo_num_steps=8。
      # flow_shift 同样从那里读（12.0 / 音频 3.0），见硬约束 4。
      num_inference_steps: 8
