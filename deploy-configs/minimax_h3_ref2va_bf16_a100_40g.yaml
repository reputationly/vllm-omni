# MiniMax-H3 Ref2VA Base/Turbo (BF16) — A100 PCIE 40G x4
#
# Ref2VA uses a different DiT partition from FL2VA.  The currently available
# official weights are BF16 at the persistent model mount:
#   /nfs-models/wuhanjisuan894/models/MiniMax-H3/Ref2VA
# Do not point this profile at MiniMax-H3-FL2VA-INT8: that checkpoint only
# contains the FL2VA transformer and cannot serve reference-video tasks.
#
# The model path selects Base or Turbo4.  The checkpoint metadata selects the
# default NFE (20 or 4), so this profile deliberately does not pin a step count.
#
# The Ref2VA product profile preserves each reference image's aspect ratio,
# avoids interpolation-only upscaling, and caps one image at the maximum H3
# output canvas area.  These are stage-scoped because the serving capability
# probe and worker must resolve exactly the same geometry.
pipeline: minimax_h3_dit
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    # Pin model partition selection at startup instead of relying on a path
    # basename.  Per-request task=ref2va is still validated by the pipeline.
    task_type: ref2va
    max_num_seqs: 1
    devices: "0,1,2,3"

    env:
      VLLM_OMNI_H3_INFERENCE_CONTRACT: legacy
      VLLM_OMNI_H3_REF_IMAGE_GEOMETRY: official_short_edge
      VLLM_OMNI_H3_REF_IMAGE_NO_UPSCALE: "1"
      VLLM_OMNI_H3_REF_IMAGE_MAX_PIXELS: "1032192"

    enable_cpu_offload: true
    vae_use_tiling: true
    diffusion_attention_backend: FLASH_ATTN

    # H3's whole graph is too large to compile as one unit.  Regional dynamic
    # compile pays a cold-start cost and is reused by subsequent requests.
    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true

    enable_multithread_weight_load: false
    enable_diffusion_pipeline_profiler: true

    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
