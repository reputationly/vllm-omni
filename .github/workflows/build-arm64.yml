name: Build vLLM-Omni ARM64 image to ACR (+ GHCR / Docker Hub)

# 全模型通用镜像出包流水线(照 index-tts / LightX2V 的 build-arm64 模式)。
#
# 与那两个的差异 —— vLLM-Omni 更省一段:
#   LightX2V 要自建 CUDA+torch base(PyPI aarch64 torch 是 CPU-only,得自己编),
#   还要 sync-base-to-dockerhub 把 base 搬到 Docker Hub。
#   vLLM-Omni 直接用 vllm 官方镜像 vllm/vllm-openai(自带 arm64 + sm_80 预编译
#   kernel,且本来就在 Docker Hub)当 base → 无需自建 base、无需 sync 流水线。
#   本流水线只 build app 层:COPY 源码 + `uv pip install .`(见 docker/Dockerfile.cuda)。
#
# 预检结论(IndexTTS-2 实测报告已确认):vllm/vllm-openai:v0.25.0 官方带 arm64,
#   torch 2.11.0+cu130 与 vllm kernel .so 均含 sm_80(A100 可用)。
#
# 推送目标(2026-09-22 起三个):ACR 是 GPU 机的拉取源(内网,必须有);
# ghcr 与 Docker Hub 是境外副本,同一次 build-push 一起推,成本近乎为零。
#
# ACR 登录做了 5 次重试:这天连挂 5 次构建,其中 4 次就是挂在登录的
# "TLS handshake timeout" / "context deadline exceeded" —— 阿里云侧偶发抽风,
# 不是配置问题(index-tts 用同样写法一直好使,本仓当天更早一次也推成功过)。
# docker/login-action 不带重试,所以那一步改成显式循环。
#
# 顺带记两个实测结论,省得以后再试:
#   - 机器直接从 ghcr 拉:包设 public 后鉴权没问题,但带宽只有 34 KB/s,38 GB 拉不动。
#     所以 ghcr 只是副本,不是拉取源。
#   - 在 GPU 机上本地 docker build:卡在 uv pip install(境内到 PyPI),16 分钟只用了
#     1 秒 CPU。也不通。
#
# Secrets(repo Settings -> Secrets,与 gpustack / index-tts / LightX2V fork 同名):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN — Docker Hub(registry build cache + 双推,提速关键)
#
# 提速(2026-07-20):① Dockerfile 层序把固化依赖提到 COPY 源码之前 → 改源码只重跑 app 层;
#   ② build cache 从 GHA(10GB 上限,大镜像放不下→形同冷构建)换成 Docker Hub registry cache
#   (无上限、跨 run 持久增量)。首次跑仍冷(建 buildcache),之后增量出包应明显变快。
#
# Run: GitHub -> Actions -> "Build vLLM-Omni ARM64 image (GHCR + Docker Hub)" -> Run workflow
#   or: gh workflow run build-arm64.yml --ref main

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: 'vLLM 官方 base(Docker Hub 公开,GHA runner 拉得快)。必须与 docker/Dockerfile.cuda 的默认基座同版本,否则按基座版本分叉的 import 路径会在启动时才炸。自 2026-09-06 的上游同步起为 vLLM 0.28;2026-09-21 同步 upstream/main 后为 0.29(上游 #7445 已把 Dockerfile.cuda 基座对齐,entrypoints.launcher 也在 0.29 挪成了 launchers.launcher)。历史:0.25->0.26 时 omni_ar_scheduler 改读 Request.num_in_flight_tokens,基座落后会让走 AR 调度的模型(TTS/LLM stage)首请求即 EngineDead。'
        default: 'vllm/vllm-openai:v0.29.0'
        required: true
      dest_tag:
        description: '要发布的浮动 tag（ghcr / Docker Hub 同名；ACR 侧由镜像同步带过去）'
        default: 'arm64-a100-latest'
        required: true

env:
  ACR_REGISTRY: crpi-xzr81d0490mc3794.cn-shanghai.personal.cr.aliyuncs.com
  ACR_REPO: crpi-xzr81d0490mc3794.cn-shanghai.personal.cr.aliyuncs.com/reputationly/vllm-omni
  # Docker Hub:registry build cache(无 GHA 10GB 上限,跨 run 增量)+ 双推镜像。
  DOCKERHUB_REPO: arronlee/vllm-omni
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/vllm-omni

jobs:
  build:
    # GitHub 原生 arm64 runner(与 index-tts / LightX2V 一致)。
    # base 从 Docker Hub 拉(快),app 层只拷代码 + pip install,不重编 CUDA 扩展。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write   # 建 GitHub Release
      packages: write   # 推 ghcr（用内置 GITHUB_TOKEN，无需额外 secret）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools_scm 需要 git 历史/tag 生成版本号

      - name: Compute immutable tag
        id: tags
        run: |
          echo "version=arm64-a100-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr 与 runner 同在 GitHub 侧,推送不跨境 —— 这是主目标。
      # 用内置 GITHUB_TOKEN,不需要额外 secret(job 需 packages: write 权限)。
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # base 从 Docker Hub 公开镜像拉不需要登录;这步是为 registry build cache
      # 的 cache-to 推送 + 镜像双推 Docker Hub。
      # ACR 登录带重试:2026-09-22 这天连挂 5 次,其中 4 次就是这一步的
      # "TLS handshake timeout" / "context deadline exceeded" —— 是阿里云侧的偶发抽风,
      # 不是配置问题(index-tts 用同样的写法一直是好的,本仓当天更早一次也推成功过)。
      # docker/login-action 不带重试,所以改成显式循环。
      - name: Login to Aliyun ACR (with retry)
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            if echo "$ACR_PASSWORD" | docker login "${{ env.ACR_REGISTRY }}" \
                 -u "$ACR_USERNAME" --password-stdin; then
              echo "ACR 登录成功(第 $i 次尝试)"; exit 0
            fi
            echo "ACR 登录失败,第 $i 次,20s 后重试"; sleep 20
          done
          echo "ACR 登录 5 次仍失败"; exit 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 同时推 ghcr 与 Docker Hub —— 两个都在境外,从 GHA runner 推不跨境。
      # ACR 不在这里推(跨境,实测必挂),改由阿里云侧的镜像同步从 Docker Hub 拉。
      - name: Build and push to GHCR + Docker Hub (arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image }}
          tags: |
            ${{ env.GHCR_REPO }}:${{ github.event.inputs.dest_tag }}
            ${{ env.GHCR_REPO }}:${{ steps.tags.outputs.version }}
            ${{ env.DOCKERHUB_REPO }}:${{ github.event.inputs.dest_tag }}
            ${{ env.DOCKERHUB_REPO }}:${{ steps.tags.outputs.version }}
            ${{ env.ACR_REPO }}:${{ github.event.inputs.dest_tag }}
            ${{ env.ACR_REPO }}:${{ steps.tags.outputs.version }}
          # buildcache 也放 ghcr:缓存推送同样不该跨境(它按 mode=max 推,量不小)。
          cache-from: type=registry,ref=${{ env.GHCR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_REPO }}:buildcache,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: vLLM-Omni ${{ steps.tags.outputs.version }}
          body: |
            vLLM-Omni 全模型通用 arm64 镜像。**权威位置是 ghcr**，ACR / Docker Hub 是
            尽力而为的副本（跨境复制，可能缺）。

            - GHCR（权威）: `${{ env.GHCR_REPO }}:${{ github.event.inputs.dest_tag }}` / `:${{ steps.tags.outputs.version }}`
            - ACR（副本）: `${{ env.ACR_REPO }}:${{ github.event.inputs.dest_tag }}` / `:${{ steps.tags.outputs.version }}`
            - Docker Hub: `${{ env.DOCKERHUB_REPO }}:${{ github.event.inputs.dest_tag }}` / `:${{ steps.tags.outputs.version }}`
            - Digest: `${{ steps.build.outputs.digest }}`
            - Base: `${{ github.event.inputs.base_image }}`
            - Commit: ${{ github.sha }}

            **覆盖范围:** 该 commit 仓库里的全部模型(`vllm serve <model> --omni`)。
            **分发(隔离网):** 在 238 跑 `lx2v-node.sh prepare-transfer`(pull → save → NFS tar),节点 `docker load`。
            **上机预检:** `docker run --rm --gpus all <img> python -c "import torch;print(torch.cuda.get_arch_list())"` 确认含 sm_80。

      - name: Summary
        run: |
          {
            echo "### vLLM-Omni arm64 image pushed to ACR"
            echo ""
            echo "- \`${ACR_REPO}:${{ github.event.inputs.dest_tag }}\` (floating)"
            echo "- \`${ACR_REPO}:${{ steps.tags.outputs.version }}\` (immutable)"
            echo ""
            echo "Distribute: on 238 run \`lx2v-node.sh prepare-transfer\`, then \`docker load\` on nodes."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ACR_REPO: ${{ env.ACR_REPO }}
